apiVersion: v1
kind: Service
metadata:
  name: auth-service
spec:
  selector:
    app: auth
  ports:
  - name: http
    port: 8082
    targetPort: 8082
  - name: grpc
    port: 9090
    targetPort: 9090
---
apiVersion: v1
kind: Service
metadata:
  name: auth-grpc
spec:
  selector:
    app: auth
  ports:
  - name: grpc
    port: 9090
    targetPort: 9090
