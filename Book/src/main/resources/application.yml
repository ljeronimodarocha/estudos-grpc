server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/book-postgres
    username: authuser
    password: authpass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      use-new-id-generator-mappings: false
      ddl-auto: create
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  profiles:
    active: dev
  grpc:
    client:
      channels:
        auth-service:
          address: "localhost:9090"

jwt:
  secret-key: your-secret-key
  token-validity-seconds: 3600
  refresh-token-validity-seconds: 86400

cache:
  redis:
    host: localhost
    port: 6379

logging:
  level:
    org.springframework.security: DEBUG
    com.example.bookapp: DEBUG
